# Rancher MCP Server Configuration Example
#
# Configuration Priority (highest to lowest):
# 1. Command-line flags: --port=8080 --rancher-server-url=...
# 2. Environment variables: RANCHER_MCP_PORT=8080 RANCHER_MCP_RANCHER_SERVER_URL=...
# 3. Configuration file: config.yaml
# 4. Default values
#
# Environment Variable Format:
# - Prefix: RANCHER_MCP_
# - Field name conversion: Replace hyphens and dots with underscores
# - Examples:
#   RANCHER_MCP_PORT=8080
#   RANCHER_MCP_SSE_BASE_URL=https://example.com
#   RANCHER_MCP_RANCHER_SERVER_URL=https://rancher.example.com
#   RANCHER_MCP_RANCHER_TOKEN=your-token
#   RANCHER_MCP_RANCHER_TLS_INSECURE=true
#   RANCHER_MCP_MAX_FILE_SIZE=10Mi
#   RANCHER_MCP_READ_ONLY=true
#   RANCHER_MCP_TOOLSETS=kubernetes,rancher

# Server configuration
port: 0  # 0 means stdio mode for MCP client integration
# For HTTP/SSE mode, set a port like 8080
# port: 8080

# SSE (Server-Sent Events) configuration
# sse_base_url: https://your-domain.com:8080  # Public base URL for SSE endpoint

log_level: 5  # Log level 0-9 (default: 5, Info)

# Rancher configuration
rancher_server_url: https://your-rancher-server.com

# Authentication: choose exactly one mode below.

# Mode 1: Static credentials
# Static Bearer Token:
rancher_token: your-bearer-token-here
# Or Access Key/Secret Key:
# rancher_access_key: your-access-key-here
# rancher_secret_key: your-secret-key-here

# Mode 2: Direct per-request token (HTTP/SSE mode only)
# When enabled, the server uses Authorization: Bearer <token> from each HTTP/SSE
# request. If Authorization is absent, it uses a non-empty raw R_token header instead.
# A present malformed or empty Authorization header never falls back to R_token.
# Static credentials above must be empty.
# rancher_request_token_auth: false

# Mode 3: Rancher OAuth token passthrough (Streamable HTTP /mcp only)
# The MCP client obtains a Rancher access token outside this service. The server
# validates the Bearer JWT and then passes the verified token to Rancher APIs.
# Static credentials and rancher_request_token_auth must be empty/false.
# This mode requires a root public resource URL and does not register /sse or
# /message. It is not a generic MCP OAuth or RFC 9728 implementation.
# rancher_oauth_token_auth: false
# rancher_oauth_authorization_server_url: https://rancher.example.com/oidc
# rancher_oauth_jwks_url: https://rancher.example.com/oidc/.well-known/jwks.json
# rancher_oauth_resource_url: https://mcp.example.com

# TLS configuration
# rancher_tls_insecure: false  # Skip TLS verification for self-signed certs (default: false)

# Security configuration
read_only: true  # Read-only mode (default: true)
disable_destructive: false  # Disable destructive operations
show_sensitive_data: false  # Allow showing sensitive data (e.g., Secret values). Default: false

# Enable pod command execution tool (disabled by default for security)
# WARNING: Allows running arbitrary commands in containers. Requires read_only: false.
enable_container_exec: false

# Enable container file upload tool (disabled by default for security)
# WARNING: Allows writing files to containers. Only enable in trusted environments.
enable_container_file_upload: false

# Enable container file download tool (disabled by default for security)
enable_container_file_download: false

# Maximum file size for container file operations (Kubernetes quantity format)
# Examples: 10Mi, 100Mi, 1Gi
max_file_size: "10Mi"

# Output configuration
list_output: table  # Output format: table, yaml, json

# Output filters - Remove verbose fields from Kubernetes resources to reduce output size
# Path format: dot-separated keys, e.g. "metadata.managedFields"
# For annotation keys containing dots, use full path after "annotations."
# Example: "metadata.annotations.kubectl.kubernetes.io/last-applied-configuration"
output_filters:
  - metadata.managedFields
  - metadata.annotations.kubectl.kubernetes.io/last-applied-configuration

# Toolset configuration
toolsets:
  - kubernetes
  - rancher

# Tool enable/disable configuration
enabled_tools: []  # Enable specific tools
disabled_tools: []  # Disable specific tools
